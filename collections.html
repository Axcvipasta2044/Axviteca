<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <script>
    // Aplica el tema guardado antes de pintar para evitar el destello blanco.
    (function () {
      try {
        var theme = localStorage.getItem('smart-aula-theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#111827');
        }
      } catch (error) {}
    })();
  </script>
  <meta name="application-name" content="Smart Aula">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Smart Aula">
  <title>Mis colecciones - Smart Aula</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/pwa.css">
  <script src="/js/pwa.js" defer></script>
</head>
<body data-page="collections">
  <div class="app-layout">
    <aside class="sidebar" aria-label="Menu">
      <a href="index.html" class="sidebar__brand"><span class="navbar__logo">SA</span> Smart Aula</a>
      <nav class="sidebar__nav">
        <a href="dashboard.html" class="sidebar__link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Inicio</a>
        <a href="index.html" class="sidebar__link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>Explorar</a>
        <a href="collections.html" class="sidebar__link is-active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Colecciones</a>
        <a href="saved.html" class="sidebar__link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 21-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>Guardados</a>
        <a href="upload.html" class="sidebar__link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Subir PDF</a>
        <a href="profile.html" class="sidebar__link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Perfil</a>
      </nav>
      <div class="sidebar__footer">
        <button type="button" id="logout-btn" class="sidebar__logout btn btn--ghost btn--sm">Cerrar sesion</button>
        <a href="profile.html" class="sidebar__user">
          <span class="sidebar__avatar">?</span>
          <div><div class="sidebar__user-name">Usuario</div><div class="sidebar__user-email"></div></div>
        </a>
      </div>
    </aside>
    <div class="sidebar-overlay"></div>
    <div class="app-main">
      <header class="topbar">
        <div class="topbar__left">
          <button type="button" class="topbar__menu-btn" aria-label="Menu">&#9776;</button>
          <h1 class="topbar__title">Mis colecciones</h1>
        </div>
        <div class="topbar__actions">
          <a href="dashboard.html" class="btn btn--secondary btn--sm">Biblioteca</a>
        </div>
      </header>
      <main class="app-content">
        <div class="collections-toolbar">
          <div>
            <h2 class="h3">Organiza tus PDFs</h2>
            <p class="text-muted">Crea colecciones privadas o compartelas con un enlace publico.</p>
          </div>
        </div>

        <form id="collection-form" class="collection-form">
          <div class="input-group">
            <label class="input-label" for="collection-name">Nombre</label>
            <input id="collection-name" name="name" class="input" placeholder="Ej: Algebra para examen" required>
          </div>
          <div class="input-group">
            <label class="input-label" for="collection-description">Descripcion</label>
            <input id="collection-description" name="description" class="input" placeholder="Opcional">
          </div>
          <button type="submit" class="btn btn--primary">Crear coleccion</button>
        </form>

        <div id="collections-list" class="collections-grid"></div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/collections.js"></script>
</body>
</html>
