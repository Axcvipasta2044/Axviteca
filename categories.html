<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <script>
    // Aplica el tema guardado antes de pintar para evitar el destello blanco.
    (function () {
      try {
        var theme = localStorage.getItem('smart-aula-theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#111827');
        }
      } catch (error) {}
    })();
  </script>
  <meta name="application-name" content="Smart Aula">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Smart Aula">
  <meta name="description" content="Categorías de Smart Aula para explorar PDFs educativos por tema.">
  <title>Categorías — Smart Aula</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/icons/logo-smart-aula.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/pwa.css">
  <script src="/js/pwa.js" defer></script>
</head>
<body data-page="categories">
  <header class="navbar">
    <div class="navbar__inner">
      <a href="index.html" class="navbar__brand">
        <span class="navbar__logo">SA</span>
        Smart Aula
      </a>
      <nav class="navbar__nav" aria-label="Principal">
        <a href="dashboard.html" class="navbar__link">Explorar</a>
        <a href="dashboard.html" class="navbar__link">Biblioteca</a>
        <a href="categories.html" class="navbar__link is-active">Categorías</a>
        <a href="collections.html" class="navbar__link">Colecciones</a>
        <a href="upload.html" class="navbar__link">Subir</a>
      </nav>
      <div class="navbar__actions">
        <a href="login.html" id="nav-login" class="btn btn--ghost">Ingresar</a>
        <a href="upload.html" id="nav-upload" class="btn btn--primary">Subir PDF</a>
        <button type="button" class="navbar__toggle" aria-label="Menú" aria-expanded="false">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
      <div class="navbar__mobile">
        <a href="dashboard.html">Explorar</a>
        <a href="dashboard.html">Biblioteca</a>
        <a href="categories.html">Categorías</a>
        <a href="collections.html">Colecciones</a>
        <a href="upload.html">Subir PDF</a>
        <a href="login.html" id="nav-login-mobile">Ingresar</a>
      </div>
    </div>
  </header>

  <main>
    <section class="section section--categories">
      <div class="container">
        <div class="category-section__header">
          <span class="section-kicker">Categorías</span>
          <h1 class="h2">Explora por tema</h1>
        </div>
        <div id="category-directory" class="category-directory"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    SmartDB.whenReady.then(async () => {
      const cats = SmartDB.isReady() ? await SmartDB.getCategories() : [];
      SmartUI.categoryCards('category-directory', cats);

      const user = await SmartAuth.getUser();
      if (user) {
        const profile = await SmartDB.getProfile(user.id);
        if (profile?.role === 'admin' || profile?.role === 'superadmin') {
          document.getElementById('nav-admin')?.style.setProperty('display', '', 'important');
          document.getElementById('nav-admin')?.addEventListener('click', (e) => {
            e.preventDefault();
            window.location.href = 'admin.html';
          });
        }
      }
    });
  </script>
</body>
</html>
