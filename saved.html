<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <script>
    // Aplica el tema guardado antes de pintar para evitar el destello blanco.
    (function () {
      try {
        var theme = localStorage.getItem('smart-aula-theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#111827');
        }
      } catch (error) {}
    })();
  </script>
  <meta name="application-name" content="Smart Aula">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Smart Aula">

  <link rel="stylesheet" href="/css/pwa.css">
  <script src="/js/pwa.js" defer></script>
</head>
<body data-page="saved">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/saved.js"></script>
  <script>
    SmartDB.whenReady.then(async () => {
      const user = await SmartAuth.getUser();
      if (user) {
        const profile = await SmartDB.getProfile(user.id);
        if (profile?.role === 'admin' || profile?.role === 'superadmin') {
          document.getElementById('sidebar-admin-link')?.style.setProperty('display', '', 'important');
        }
      }
    });
  </script>
