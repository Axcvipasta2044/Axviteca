<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <script>
    // Aplica el tema guardado antes de pintar para evitar el destello blanco.
    (function () {
      try {
        var theme = localStorage.getItem('smart-aula-theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#111827');
        }
      } catch (error) {}
    })();
  </script>
  <meta name="application-name" content="Smart Aula">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Smart Aula">
  <title>Ingresar — Smart Aula</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/pwa.css">
  <script src="/js/pwa.js" defer></script>
</head>
<body data-page="login">

  <div class="login-page">
    <div class="login-panel login-panel--form">
      <a href="index.html" class="navbar__brand login-brand">
        <span class="navbar__logo">SA</span> Smart Aula
      </a>
      <div id="auth-alert" class="auth-alert"></div>
      <form id="auth-form" class="login-form" novalidate>
        <div class="login-form__header">
          <h1 id="auth-title">Bienvenido</h1>
          <p id="auth-subtitle" class="text-secondary">Inicia sesión para subir PDFs</p>
        </div>
        <button type="button" id="google-login" class="btn btn--google">
          <span class="btn__icon btn__icon--google" aria-hidden="true">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
          </span>
          Continuar con Google
        </button>
        <div class="divider">o con correo</div>
        <div id="username-group" class="input-group hidden">
          <label class="input-label" for="username">Usuario</label>
          <input type="text" id="username" name="username" class="input" autocomplete="username">
        </div>
        <div class="input-group">
          <label class="input-label" for="email">Correo</label>
          <input type="email" id="email" name="email" class="input" required autocomplete="email" inputmode="email" aria-describedby="auth-alert">
        </div>
        <div class="input-group">
          <label class="input-label" for="password">Contraseña</label>
          <input type="password" id="password" name="password" class="input" required minlength="6" autocomplete="current-password">
        </div>
        <p class="text-sm text-right"><a href="#" id="forgot-password" class="link">¿Olvidaste tu contraseña?</a></p>
        <button type="submit" id="auth-submit" class="btn btn--primary btn--lg btn--block">Entrar</button>
        <p id="toggle-mode" class="text-muted text-sm text-center">¿No tienes cuenta? <a href="login.html?mode=register">Crear cuenta</a></p>
        <p class="text-muted text-sm text-center mt-md"><a href="dashboard.html" class="link">Continuar sin cuenta → Explorar gratis</a></p>
      </form>
    </div>
    <div class="login-panel login-panel--visual">
      <div class="login-visual__content">
        <h2>Educación abierta para todos</h2>
        <p>Lee PDFs gratis. Solo necesitas cuenta para subir y guardar favoritos.</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
